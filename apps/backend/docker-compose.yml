# =============================================================================
# R.E.M.I Backend Rebuild - Docker Compose Configuration
# =============================================================================
# This configuration sets up all required services for local development:
# - PostgreSQL: Primary database with UUID and JSONB support
# - Redis: Event streaming and caching
# - Ollama: Local LLM inference
# - ChromaDB: Vector database for embeddings
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:14-alpine
    container_name: remi_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mesh_development
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remi_network

  # ===========================================================================
  # Redis (Event Bus & Caching)
  # ===========================================================================
  redis:
    image: redis:6-alpine
    container_name: remi_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remi_network

  # ===========================================================================
  # Ollama (Local LLM Inference)
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: remi_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "test -f /root/.ollama/id_ed25519 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - remi_network
    deploy:
      resources:
        limits:
          memory: 4G

  # ===========================================================================
  # ChromaDB (Vector Database)
  # ===========================================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: remi_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - remi_network

  # ===========================================================================
  # Matrix Synapse (Homeserver for WhatsApp Bridge)
  # ===========================================================================
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: remi_synapse
    environment:
      - SYNAPSE_SERVER_NAME=localhost
      - SYNAPSE_REPORT_STATS=no
      - UID=0
      - GID=0
    ports:
      - "8008:8008"
    volumes:
      # Use bind mount for data directory (writable)
      - ./data/synapse:/data
      # Mount config files directly to /data where Synapse expects them
      - ./config/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./config/synapse/whatsapp-registration.yaml:/data/whatsapp-registration.yaml:ro
      - ./config/synapse/localhost.log.config:/data/localhost.log.config:ro
      - ./config/synapse/localhost.signing.key:/data/localhost.signing.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - remi_network

  # ===========================================================================
  # mautrix-whatsapp (WhatsApp Bridge)
  # ===========================================================================
  whatsapp-bridge:
    image: dock.mau.dev/mautrix/whatsapp:latest
    container_name: remi_whatsapp_bridge
    ports:
      - "29318:29318"  # Provisioning API
    volumes:
      - whatsapp_bridge_data:/data
      # Mount config file directly to /data where mautrix expects it
      - ./config/mautrix-whatsapp/config.yaml:/data/config.yaml:ro
    depends_on:
      synapse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - MAUTRIX_DIRECT_STARTUP=true
    networks:
      - remi_network
    restart: unless-stopped

  # ===========================================================================
  # Backend API (Optional - for full stack development)
  # ===========================================================================
  # Uncomment to run the backend API in Docker
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: remi_api
  #   command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - .:/app
  #     - /app/.venv
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/mesh_development
  #     - REDIS_URL=redis://redis:6379
  #     - OLLAMA_BASE_URL=http://ollama:11434
  #     - CHROMA_HOST=chromadb
  #     - CHROMA_PORT=8000
  #     - ENV=development
  #     - DEBUG=true
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     ollama:
  #       condition: service_healthy
  #     chromadb:
  #       condition: service_healthy
  #   networks:
  #     - remi_network

# =============================================================================
# Networks
# =============================================================================
networks:
  remi_network:
    driver: bridge

# =============================================================================
# Volumes (Persistent Data)
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  chromadb_data:
    driver: local
  whatsapp_bridge_data:
    driver: local

