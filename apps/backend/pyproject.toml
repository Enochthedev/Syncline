[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "security: talks to a running instance (set TEST_URL)",
    "performance: talks to a running instance (set TEST_URL)",
    "slow: excluded from normal runs",
    "stress: stress test",
    "benchmark: benchmark",
]
