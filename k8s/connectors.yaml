apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-connectors
  namespace: mesh-system
  labels:
    app.kubernetes.io/name: mesh-connectors
    app.kubernetes.io/component: connectors
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-connectors
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-connectors
        app.kubernetes.io/component: connectors
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: connectors
        image: mesh-system/connectors:latest
        ports:
        - containerPort: 8003
          name: metrics
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: mesh-config
              key: REDIS_URL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: mesh-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: mesh-config
              key: LOG_LEVEL
        # Platform-specific credentials
        - name: GMAIL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: GMAIL_CLIENT_ID
              optional: true
        - name: GMAIL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: GMAIL_CLIENT_SECRET
              optional: true
        - name: SLACK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: SLACK_CLIENT_ID
              optional: true
        - name: SLACK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: SLACK_CLIENT_SECRET
              optional: true
        - name: DISCORD_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: DISCORD_BOT_TOKEN
              optional: true
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: TWITTER_API_KEY
              optional: true
        - name: TWITTER_API_SECRET
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: TWITTER_API_SECRET
              optional: true
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: TELEGRAM_BOT_TOKEN
              optional: true
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "from integrations.connector_manager import ConnectorManager; print('Connectors healthy')"
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "from integrations.connector_manager import ConnectorManager; print('Connectors ready')"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: mesh-storage-pvc
      - name: logs
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-connectors-service
  namespace: mesh-system
  labels:
    app.kubernetes.io/name: mesh-connectors
    app.kubernetes.io/component: connectors
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    name: metrics
  selector:
    app.kubernetes.io/name: mesh-connectors