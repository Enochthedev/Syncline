apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mesh-storage-pvc
  namespace: mesh-system
  labels:
    app.kubernetes.io/name: mesh-storage
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: nfs-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mesh-vector-pvc
  namespace: mesh-system
  labels:
    app.kubernetes.io/name: mesh-vector
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mesh-logs-pvc
  namespace: mesh-system
  labels:
    app.kubernetes.io/name: mesh-logs
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard