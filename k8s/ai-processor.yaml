apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-ai-processor
  namespace: mesh-system
  labels:
    app.kubernetes.io/name: mesh-ai-processor
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-ai-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesh-ai-processor
        app.kubernetes.io/component: ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: ai-processor
        image: mesh-system/ai-processor:latest
        ports:
        - containerPort: 8002
          name: metrics
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: mesh-config
              key: REDIS_URL
        - name: CHROMA_HOST
          valueFrom:
            configMapKeyRef:
              name: mesh-config
              key: CHROMA_HOST
        - name: CHROMA_PORT
          valueFrom:
            configMapKeyRef:
              name: mesh-config
              key: CHROMA_PORT
        - name: OLLAMA_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: mesh-config
              key: OLLAMA_BASE_URL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: mesh-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: mesh-config
              key: LOG_LEVEL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: mesh-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: logs
          mountPath: /app/logs
        - name: vector-db
          mountPath: /app/vector_db
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "from services.ai.engine import AIProcessingEngine; print('AI service healthy')"
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "from services.ai.engine import AIProcessingEngine; print('AI service ready')"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - python
            - -c
            - "from services.ai.engine import AIProcessingEngine; print('AI service starting')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: mesh-storage-pvc
      - name: logs
        emptyDir: {}
      - name: vector-db
        persistentVolumeClaim:
          claimName: mesh-vector-pvc
      restartPolicy: Always
      # Node affinity for GPU nodes if available
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: accelerator
                operator: In
                values:
                - nvidia-tesla-k80
                - nvidia-tesla-p4
                - nvidia-tesla-v100
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-ai-processor-service
  namespace: mesh-system
  labels:
    app.kubernetes.io/name: mesh-ai-processor
    app.kubernetes.io/component: ai
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    name: metrics
  selector:
    app.kubernetes.io/name: mesh-ai-processor