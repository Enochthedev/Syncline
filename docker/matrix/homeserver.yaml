# Matrix Synapse homeserver configuration for R.E.M.I WhatsApp integration

server_name: "matrix.remi.local"
pid_file: /data/homeserver.pid
web_client_location: https://app.element.io/

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ['::1', '127.0.0.1', '0.0.0.0']

    resources:
      - names: [client, federation]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

log_config: "/data/matrix.remi.local.log.config"

media_store_path: /data/media_store

registration_shared_secret: "remi_whatsapp_bridge_secret_key_2024"

report_stats: false

macaroon_secret_key: "remi_matrix_macaroon_secret_2024"

form_secret: "remi_matrix_form_secret_2024"

signing_key_path: "/data/matrix.remi.local.signing.key"

trusted_key_servers:
  - server_name: "matrix.org"

# Enable application services for WhatsApp bridge
app_service_config_files:
  - /data/whatsapp-registration.yaml

# Allow bridge users to register
enable_registration: true
enable_registration_without_verification: true

# Rate limiting (relaxed for bridge usage)
rc_message:
  per_second: 10
  burst_count: 50

rc_registration:
  per_second: 0.5
  burst_count: 5

rc_login:
  address:
    per_second: 0.5
    burst_count: 5
  account:
    per_second: 0.5
    burst_count: 5
  failed_attempts:
    per_second: 0.5
    burst_count: 5

# Federation settings
federation_domain_whitelist: []

# Presence settings
use_presence: false

# User directory
user_directory:
  enabled: true
  search_all_users: true

# Metrics
enable_metrics: true
metrics_port: 9090

# Experimental features
experimental_features:
  msc3026_enabled: true  # Busy presence state
  msc2716_enabled: true  # Incrementally importing history