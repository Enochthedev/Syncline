version: '3.8'

services:
  # WhatsApp Bridge Manager Service
  whatsapp-bridge-manager:
    build: 
      context: ../
      dockerfile: docker/Dockerfile.bridge-manager
    container_name: remi_whatsapp_bridge_manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - whatsapp_bridges_config:/app/bridges
      - whatsapp_bridges_data:/app/data
    environment:
      - BRIDGE_IMAGE=dock.mau.dev/mautrix/whatsapp:latest
      - MAX_BRIDGES=10
      - MATRIX_SERVER=http://matrix:8008
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/remi
    networks:
      - remi_network
    depends_on:
      - matrix
      - redis
      - postgres
    restart: unless-stopped

  # Matrix Homeserver (Synapse)
  matrix:
    image: matrixdotorg/synapse:latest
    container_name: remi_matrix_synapse
    volumes:
      - matrix_data:/data
      - ./matrix/homeserver.yaml:/data/homeserver.yaml
    environment:
      - SYNAPSE_SERVER_NAME=matrix.remi.local
      - SYNAPSE_REPORT_STATS=no
    ports:
      - "8008:8008"
    networks:
      - remi_network
    restart: unless-stopped

  # Redis for event streaming
  redis:
    image: redis:7-alpine
    container_name: remi_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - remi_network
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: remi_postgres
    environment:
      - POSTGRES_DB=remi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - remi_network
    restart: unless-stopped

  # R.E.M.I Main Application
  remi-app:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: remi_app
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/remi
      - REDIS_URL=redis://redis:6379
      - MATRIX_HOMESERVER_URL=http://matrix:8008
      - WHATSAPP_BRIDGE_ENABLED=true
    ports:
      - "8000:8000"
    networks:
      - remi_network
    depends_on:
      - postgres
      - redis
      - matrix
      - whatsapp-bridge-manager
    restart: unless-stopped

volumes:
  whatsapp_bridges_config:
    driver: local
  whatsapp_bridges_data:
    driver: local
  matrix_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  remi_network:
    driver: bridge