# Prometheus alerting rules for MESH system

groups:
  - name: mesh-system-health
    rules:
      - alert: MeshSystemDown
        expr: up{job="mesh-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MESH system is down"
          description: "MESH API has been down for more than 1 minute"

      - alert: MeshConnectorUnhealthy
        expr: mesh_connector_health == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MESH connector unhealthy"
          description: "Connector {{ $labels.platform }} ({{ $labels.connector_type }}) has been unhealthy for more than 2 minutes"

      - alert: MeshHighErrorRate
        expr: rate(mesh_api_requests_total{status_code=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in MESH API"
          description: "API error rate is {{ $value }} errors per second for endpoint {{ $labels.endpoint }}"

  - name: mesh-performance
    rules:
      - alert: MeshHighLatency
        expr: histogram_quantile(0.95, rate(mesh_api_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency in MESH"
          description: "95th percentile latency is {{ $value }}s for {{ $labels.method }} {{ $labels.endpoint }}"

      - alert: MeshMessageIngestionSlow
        expr: histogram_quantile(0.95, rate(mesh_message_ingestion_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow message ingestion"
          description: "95th percentile message ingestion time is {{ $value }}s for {{ $labels.platform }}"

      - alert: MeshAIProcessingSlow
        expr: histogram_quantile(0.95, rate(mesh_ai_processing_duration_seconds_bucket[5m])) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slow AI processing"
          description: "95th percentile AI processing time is {{ $value }}s for {{ $labels.agent_type }} {{ $labels.operation }}"

  - name: mesh-business-metrics
    rules:
      - alert: MeshLowMessageVolume
        expr: rate(mesh_messages_ingested_total[1h]) < 0.01
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Low message ingestion volume"
          description: "Message ingestion rate is {{ $value }} messages per second, which is unusually low"

      - alert: MeshNoActiveUsers
        expr: mesh_active_users == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No active users"
          description: "No active users detected for more than 15 minutes"

  - name: mesh-infrastructure
    rules:
      - alert: MeshDatabaseConnectionsHigh
        expr: mesh_active_connections{connection_type="database"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connection count"
          description: "Database connections are at {{ $value }}, which may indicate a connection leak"

      - alert: MeshMemoryUsageHigh
        expr: mesh_memory_usage_bytes > 1e9  # 1GB
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Component {{ $labels.component }} is using {{ $value | humanize }}B of memory"