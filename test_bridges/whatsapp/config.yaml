appservice:
  address: http://localhost:29318
  as_token: test_token_123
  bot:
    avatar: mxc://maunium.net/NeXNQarUbrlYBiPCpprYsRqr
    displayname: WhatsApp Bridge Bot
    username: whatsappbot
  database:
    type: sqlite3
    uri: ./test_bridges/whatsapp/whatsapp.db
  hostname: 0.0.0.0
  hs_token: test_token_123
  id: whatsapp
  port: 29318
bridge:
  delivery_receipts: false
  displayname_template: '{displayname} (WhatsApp)'
  double_puppet_allow_discovery: false
  double_puppet_server_map: {}
  login_shared_secret_map: {}
  message_status_events: false
  permissions:
    '*': relay
    '@testuser:example.com': admin
    matrix.example.com: user
  personal_filtering_spaces: false
  portal_message_buffer: 128
  sync_direct_chat_list: false
  username_template: whatsapp_{userid}
homeserver:
  address: https://matrix.example.com
  domain: matrix.example.com
logging:
  formatters:
    colored:
      (): mautrix.util.ColorFormatter
      format: '[%(asctime)s] [%(levelname)s@%(name)s] %(message)s'
    normal:
      format: '[%(asctime)s] [%(levelname)s@%(name)s] %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: colored
    file:
      backupCount: 10
      class: logging.handlers.RotatingFileHandler
      filename: ./logs/whatsapp.log
      formatter: normal
      maxBytes: 10485760
  loggers:
    mau:
      level: DEBUG
    whatsmeow:
      level: DEBUG
  root:
    handlers:
    - file
    - console
    level: DEBUG
  version: 1
whatsapp:
  browser_name: unknown
  os_name: Mautrix-WhatsApp bridge
