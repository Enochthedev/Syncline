apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mesh-system.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mesh-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  database-url: {{ include "mesh-system.databaseUrl" . | quote }}
  
  # Platform API keys
  gmail-client-id: {{ .Values.secrets.gmail.clientId | quote }}
  gmail-client-secret: {{ .Values.secrets.gmail.clientSecret | quote }}
  slack-client-id: {{ .Values.secrets.slack.clientId | quote }}
  slack-client-secret: {{ .Values.secrets.slack.clientSecret | quote }}
  discord-bot-token: {{ .Values.secrets.discord.botToken | quote }}
  twitter-api-key: {{ .Values.secrets.twitter.apiKey | quote }}
  twitter-api-secret: {{ .Values.secrets.twitter.apiSecret | quote }}
  telegram-bot-token: {{ .Values.secrets.telegram.botToken | quote }}
  
  # AI service keys
  openai-api-key: {{ .Values.secrets.openai.apiKey | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropic.apiKey | quote }}
  
  # Security keys
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}