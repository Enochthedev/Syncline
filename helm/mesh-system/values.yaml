# Default values for mesh-system
# This is a YAML-formatted file.

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Image configuration
image:
  registry: docker.io
  repository: mesh-system
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# API service configuration
api:
  enabled: true
  replicaCount: 3
  
  image:
    repository: mesh-system/api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  livenessProbe:
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Worker service configuration
worker:
  enabled: true
  replicaCount: 2
  
  image:
    repository: mesh-system/worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1.5"
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 85

# AI Processor configuration
aiProcessor:
  enabled: true
  replicaCount: 1
  
  image:
    repository: mesh-system/ai-processor
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"
  
  # GPU support
  gpu:
    enabled: false
    type: "nvidia.com/gpu"
    count: 1

# Connectors configuration
connectors:
  enabled: true
  replicaCount: 1
  
  image:
    repository: mesh-system/connectors
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"

# Database configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "change-me-in-production"
    username: "mesh_user"
    password: "change-me-in-production"
    database: "mesh_production"
  
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: "fast-ssd"
    
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1"
    
    initdb:
      scripts:
        init.sql: |
          -- Enable required extensions
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE EXTENSION IF NOT EXISTS "btree_gin";

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: false
  
  master:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "fast-ssd"
    
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  
  replica:
    replicaCount: 1

# ChromaDB configuration
chromadb:
  enabled: true
  replicaCount: 1
  
  image:
    repository: chromadb/chroma
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
  
  persistence:
    enabled: true
    size: 100Gi
    storageClass: "fast-ssd"
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"

# Ollama configuration (optional)
ollama:
  enabled: false
  replicaCount: 1
  
  image:
    repository: ollama/ollama
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 11434
  
  persistence:
    enabled: true
    size: 50Gi
    storageClass: "standard"
  
  resources:
    requests:
      memory: "4Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "4"

# Storage configuration
storage:
  attachments:
    enabled: true
    size: 200Gi
    storageClass: "nfs-storage"
    accessMode: ReadWriteMany
  
  vectors:
    enabled: true
    size: 100Gi
    storageClass: "fast-ssd"
    accessMode: ReadWriteOnce
  
  logs:
    enabled: true
    size: 50Gi
    storageClass: "standard"
    accessMode: ReadWriteMany

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  
  hosts:
    - host: mesh.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
    - host: api.mesh.yourdomain.com
      paths:
        - path: /api/
          pathType: Prefix
        - path: /graphql
          pathType: Prefix
        - path: /docs
          pathType: Prefix
        - path: /ws/
          pathType: Prefix
  
  tls:
    - secretName: mesh-tls-secret
      hosts:
        - mesh.yourdomain.com
        - api.mesh.yourdomain.com

# Network policy
networkPolicy:
  enabled: true
  ingress:
    enabled: true
  egress:
    enabled: true

# Configuration
config:
  environment: "production"
  logLevel: "INFO"
  
  # Application settings
  maxMessageBatchSize: 100
  aiProcessingEnabled: true
  vectorDbEnabled: true
  
  # Rate limiting
  rateLimitRequestsPerMinute: 1000
  rateLimitBurstSize: 100
  
  # Health checks
  healthCheckInterval: 30
  healthCheckTimeout: 10
  
  # Monitoring
  metricsEnabled: true
  prometheusPort: 9090

# Secrets (to be overridden in production)
secrets:
  # Database
  postgresPassword: "change-me-in-production"
  databaseUrl: ""
  
  # Platform credentials
  gmail:
    clientId: ""
    clientSecret: ""
  
  slack:
    clientId: ""
    clientSecret: ""
  
  discord:
    botToken: ""
  
  twitter:
    apiKey: ""
    apiSecret: ""
  
  telegram:
    botToken: ""
  
  # AI services
  openai:
    apiKey: ""
  
  anthropic:
    apiKey: ""
  
  # Security
  jwtSecretKey: "change-me-in-production"
  encryptionKey: "change-me-in-production"

# Monitoring and observability
monitoring:
  enabled: true
  
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
  
  grafana:
    enabled: true
    dashboards:
      enabled: true
  
  alerts:
    enabled: true

# Node affinity and tolerations
nodeSelector: {}

tolerations: []

affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1