apiVersion: v2
name: mesh-system
description: A Helm chart for MESH Ingestion System - Multi-platform External Source Hub
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/your-org/mesh-ingestion-system
sources:
  - https://github.com/your-org/mesh-ingestion-system
maintainers:
  - name: MESH Team
    email: team@mesh-system.com
keywords:
  - messaging
  - ai
  - ingestion
  - multi-platform
  - real-time
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
annotations:
  category: AI/ML
  licenses: MIT